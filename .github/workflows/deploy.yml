name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: octocat-supply-azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, provision, and deploy
    runs-on: ubuntu-24.04
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION }}
      IDENTITY_RESOURCE_ID: ${{ vars.AZURE_IDENTITY_RESOURCE_ID }}
      CONTAINER_APPS_ENVIRONMENT_ID: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
      CONTAINER_APPS_LOCATION: ${{ vars.AZURE_CONTAINER_APPS_LOCATION }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test TypeScript API
        working-directory: src/api-ts
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Test frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run test:unit
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AZURE_CLIENT_ID" || -z "$AZURE_TENANT_ID" || -z "$AZURE_SUBSCRIPTION_ID" || -z "$RESOURCE_GROUP" || -z "$LOCATION" || -z "$IDENTITY_RESOURCE_ID" ]]; then
            echo "::error::Azure secrets and variables are required. Configure them using scripts/setup-oidc.sh and GitHub Actions settings."
            exit 1
          fi
          if [[ -n "$CONTAINER_APPS_ENVIRONMENT_ID" && -z "$CONTAINER_APPS_LOCATION" ]]; then
            echo "::error::AZURE_CONTAINER_APPS_LOCATION is required when using an existing Container Apps environment."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Read registry name and validate Bicep
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          registry_name="$(jq -r '.parameters.registryName.value' infra/main.parameters.json)"
          if [[ -z "$registry_name" || "$registry_name" == "null" ]]; then
            echo "::error::Set parameters.registryName.value in infra/main.parameters.json."
            exit 1
          fi
          echo "registry_name=$registry_name" >> "$GITHUB_OUTPUT"
          az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Verify resource group and registry
        env:
          REGISTRY_NAME: ${{ steps.infra.outputs.registry_name }}
        shell: bash
        run: |
          set -euo pipefail
          az group show --name "$RESOURCE_GROUP" --output none
          az acr show --name "$REGISTRY_NAME" --resource-group "$RESOURCE_GROUP" --output none

      - name: Build and push API and frontend images
        env:
          REGISTRY_NAME: ${{ steps.infra.outputs.registry_name }}
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "$REGISTRY_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)"
          for attempt in $(seq 1 12); do
            if az acr login --name "$REGISTRY_NAME"; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "::error::Could not authenticate to ACR. Check the identity's AcrPush role."
              exit 1
            fi
            sleep 10
          done
          docker build --file src/api-ts/Dockerfile --tag "$login_server/api:$IMAGE_TAG" src
          docker build --file src/frontend/Dockerfile --tag "$login_server/frontend:$IMAGE_TAG" src/frontend
          docker push "$login_server/api:$IMAGE_TAG"
          docker push "$login_server/frontend:$IMAGE_TAG"

      - name: Deploy infrastructure and apps
        env:
          REGISTRY_NAME: ${{ steps.infra.outputs.registry_name }}
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "$REGISTRY_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)"
          az deployment group create \
            --name octocat-supply \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
              registryIdentityResourceId="$IDENTITY_RESOURCE_ID" \
              existingEnvironmentResourceId="$CONTAINER_APPS_ENVIRONMENT_ID" \
              containerAppsLocation="$CONTAINER_APPS_LOCATION" \
              apiImage="$login_server/api:$IMAGE_TAG" \
              frontendImage="$login_server/frontend:$IMAGE_TAG" \
            --output none

      - name: Verify frontend and API
        shell: bash
        run: |
          set -euo pipefail
          frontend_url="$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" \
            --name octocat-supply \
            --query properties.outputs.frontendUrl.value \
            --output tsv)"
          echo "Deployed frontend: $frontend_url"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$frontend_url/api/products" >/dev/null; then
              echo "Frontend and proxied API are responding."
              exit 0
            fi
            echo "Waiting for app revision to become ready ($attempt/30)..."
            sleep 10
          done
          echo "::error::The deployed frontend or proxied API did not become healthy."
          exit 1
